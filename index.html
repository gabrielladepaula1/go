<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
  --border: #e2e2dd; --accent: #2f6f5e; --accent-soft: #e4f0ec;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161715; --surface: #1f201d; --text: #ececE6; --muted: #9a9a92;
    --border: #33342f; --accent: #7fc2ae; --accent-soft: #223a33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161715; --surface: #1f201d; --text: #ececE6; --muted: #9a9a92;
  --border: #33342f; --accent: #7fc2ae; --accent-soft: #223a33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; line-height: 1.5; }
header { padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
h1 { font-size: 18px; margin: 0 0 8px; }
#busca { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 15px; }
nav#abas { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); scrollbar-width: thin; }
nav#abas button { flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-size: 14px; white-space: nowrap; }
nav#abas button[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
main { padding: 16px; max-width: 860px; margin: 0 auto; }
.bloco { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.bloco-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.bloco h2 { font-size: 15px; margin: 0; color: var(--accent); }
.copiar { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); cursor: pointer; font-size: 13px; white-space: nowrap; }
.texto { white-space: pre-wrap; font-size: 15px; margin: 0; overflow-wrap: anywhere; }
.oculto { display: none; }
.vazio { color: var(--muted); font-style: italic; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
</style>
</head>

const SECOES = SECOES_TODAS.filter(s => s.id !== "geral" && s.id !== "exames-periodo-ubs");
let listaAberta = false;

const abas = document.getElementById("abas");
const conteudo = document.getElementById("conteudo");
const busca = document.getElementById("busca");
let ativa = SECOES[0].id;

function criarBloco(secao, bloco) {
  const el = document.createElement("section");
  el.className = "bloco";
  el.dataset.busca = (secao.titulo + " " + bloco.t + " " + bloco.x).toLowerCase();
  const topo = document.createElement("div");
  topo.className = "bloco-topo";
  const h = document.createElement("h2");
  h.textContent = bloco.t;
  const btn = document.createElement("button");
  btn.className = "copiar";
  btn.type = "button";
  btn.textContent = "Copiar";
  const p = document.createElement("p");
  p.className = "texto";
  p.textContent = bloco.x;
  p.contentEditable = "true";
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(p.innerText);
      btn.textContent = "Copiado";
    } catch (e) {
      const r = document.createRange();
      r.selectNodeContents(p);
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      btn.textContent = "Selecionado (Ctrl+C)";
    }
    setTimeout(() => (btn.textContent = "Copiar"), 1500);
  });
  topo.append(h, btn);
  el.append(topo, p);
  return el;
}

function renderAbas() {
  abas.innerHTML = "";
  SECOES.forEach(s => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(s.id === ativa));
    b.textContent = s.aba;
    b.addEventListener("click", () => { ativa = s.id; listaAberta = false; busca.value = ""; renderAbas(); renderConteudo(); });
    abas.appendChild(b);
  });
}

function renderLista(termo) {
  conteudo.innerHTML = "";
  const lista = SECOES.filter(s => !termo || (s.titulo + " " + s.blocos.map(b => b.x).join(" ")).toLowerCase().includes(termo));
  const h = document.createElement("h2");
  h.textContent = "Temas disponíveis";
  h.style.fontSize = "17px";
  conteudo.appendChild(h);
  if (!lista.length) { const p = document.createElement("p"); p.className = "vazio"; p.textContent = "Nada encontrado."; conteudo.appendChild(p); return; }
  lista.forEach(s => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "bloco";
    btn.style.display = "block";
    btn.style.width = "100%";
    btn.style.textAlign = "left";
    btn.style.cursor = "pointer";
    btn.style.color = "var(--text)";
    btn.style.font = "inherit";
    btn.textContent = s.titulo;
    btn.addEventListener("click", () => { ativa = s.id; listaAberta = false; busca.value = ""; renderAbas(); renderConteudo(); });
    conteudo.appendChild(btn);
  });
}

function renderConteudo() {
  if (listaAberta) return renderLista(busca.value.trim().toLowerCase());
  conteudo.innerHTML = "";
  const s = SECOES.find(x => x.id === ativa);
  const h = document.createElement("h2");
  h.textContent = s.titulo;
  h.style.fontSize = "17px";
  conteudo.appendChild(h);
  const tudo = s.blocos.map(b => b.t + "\n" + b.x).join("\n\n");
  conteudo.appendChild(criarBloco(s, { t: "Texto para copiar", x: tudo }));
}

busca.addEventListener("focus", () => { listaAberta = true; renderConteudo(); });
busca.addEventListener("input", () => { listaAberta = true; renderConteudo(); });
renderAbas();
renderConteudo();
</script>
